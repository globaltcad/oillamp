# How oillamp's engine logs, through slf4j-simple. Only warnings and errors by default: what the
# user needs to know goes through LampEvent, and this is for a developer looking for a cause.
org.slf4j.simpleLogger.logFile=System.err
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd'T'HH:mm:ss.SSS
org.slf4j.simpleLogger.showShortLogName=true
