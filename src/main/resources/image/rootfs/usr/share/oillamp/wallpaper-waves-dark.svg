<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- The source of wallpaper-waves-dark.png, the dark one of the two "waves" wallpapers:
       the inside of the lamp, with its name carved into the wall. wallpaper-waves-light.svg has
       the same shapes in the other palette, so a change to one belongs in both.

       From the bottom up: a band of one colour, then three rows of waves, each a little smaller
       and flatter than the one in front of it, as if further away. Each row casts a soft shadow
       upwards onto the row behind it, cut off where that row's crest is. Above them the wall,
       lightest around the name.

       Unlike wallpaper.svg it covers the whole screen (sway draws it with `fill`), so it has no
       transparent parts. On a screen that is not 16:9 its sides or its top and bottom are cut
       off; everything that matters stays near the middle. -->
  <defs>
    <radialGradient id="wall" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(960 430) scale(1150 760)">
      <stop offset="0.000" stop-color="#2c3343"/>
      <stop offset="0.062" stop-color="#2c3342"/>
      <stop offset="0.125" stop-color="#2b3141"/>
      <stop offset="0.188" stop-color="#29303f"/>
      <stop offset="0.250" stop-color="#272e3c"/>
      <stop offset="0.312" stop-color="#252b39"/>
      <stop offset="0.375" stop-color="#232936"/>
      <stop offset="0.438" stop-color="#212733"/>
      <stop offset="0.500" stop-color="#202531"/>
      <stop offset="0.562" stop-color="#1e222d"/>
      <stop offset="0.625" stop-color="#1b202a"/>
      <stop offset="0.688" stop-color="#191d26"/>
      <stop offset="0.750" stop-color="#171b23"/>
      <stop offset="0.812" stop-color="#151820"/>
      <stop offset="0.875" stop-color="#13171e"/>
      <stop offset="0.938" stop-color="#12151d"/>
      <stop offset="1.000" stop-color="#12151c"/>
    </radialGradient>
    <!-- the letters' floor: a little darker at the top, where the wall above shades it -->
    <linearGradient id="letters" x1="0" y1="350" x2="0" y2="490" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a1e27"/>
      <stop offset="1" stop-color="#232835"/>
    </linearGradient>
    <!-- Carved: inside each letter, its upper edge is in shadow and its lower edge catches the
         light, as a cut into the wall lit from above would. Below each letter the edge of the
         cut shows as a thin bright lip. -->
    <filter id="carved" x="-5%" y="-30%" width="110%" height="160%" color-interpolation-filters="sRGB">
      <feOffset in="SourceAlpha" dy="5" result="lowered"/>
      <feGaussianBlur in="lowered" stdDeviation="2.5" result="loweredSoft"/>
      <feComposite in="SourceAlpha" in2="loweredSoft" operator="out" result="upperEdge"/>
      <feFlood flood-color="#000000" flood-opacity="0.85"/>
      <feComposite in2="upperEdge" operator="in" result="shadow"/>
      <feOffset in="SourceAlpha" dy="-2.5" result="raised"/>
      <feGaussianBlur in="raised" stdDeviation="1" result="raisedSoft"/>
      <feComposite in="SourceAlpha" in2="raisedSoft" operator="out" result="lowerEdge"/>
      <feFlood flood-color="#6c7890" flood-opacity="0.55"/>
      <feComposite in2="lowerEdge" operator="in" result="light"/>
      <feOffset in="SourceAlpha" dy="1.5" result="below"/>
      <feComposite in="below" in2="SourceAlpha" operator="out" result="lipEdge"/>
      <feFlood flood-color="#3d4558" flood-opacity="0.5"/>
      <feComposite in2="lipEdge" operator="in" result="lip"/>
      <feMerge>
        <feMergeNode in="lip"/>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="shadow"/>
        <feMergeNode in="light"/>
      </feMerge>
    </filter>
    <filter id="shade" x="-5%" y="-50%" width="110%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <path id="row1" d="M-80 934.7 C-66.7 940.8 -53.3 946.9 -40 951.9 C-26.7 957.0 -13.3 961.0 0 963.6 C13.3 966.1 26.7 967.2 40 967.3 C53.3 967.3 66.7 966.5 80 965.4 C93.3 964.4 106.7 963.2 120 962.4 C133.3 961.5 146.7 961.0 160 960.5 C173.3 960.0 186.7 959.5 200 958.3 C213.3 957.1 226.7 955.1 240 952.1 C253.3 949.0 266.7 944.7 280 939.7 C293.3 934.7 306.7 929.0 320 923.6 C333.3 918.2 346.7 913.2 360 909.6 C373.3 906.0 386.7 903.9 400 903.7 C413.3 903.4 426.7 905.0 440 907.7 C453.3 910.5 466.7 914.5 480 918.6 C493.3 922.7 506.7 927.0 520 930.5 C533.3 934.1 546.7 937.1 560 939.4 C573.3 941.7 586.7 943.4 600 945.1 C613.3 946.8 626.7 948.5 640 950.7 C653.3 953.0 666.7 955.7 680 958.8 C693.3 961.9 706.7 965.3 720 968.1 C733.3 971.0 746.7 973.3 760 974.1 C773.3 974.9 786.7 974.2 800 971.7 C813.3 969.3 826.7 965.2 840 960.0 C853.3 954.9 866.7 948.8 880 942.9 C893.3 937.0 906.7 931.4 920 927.0 C933.3 922.7 946.7 919.5 960 917.6 C973.3 915.7 986.7 915.1 1000 915.1 C1013.3 915.2 1026.7 915.8 1040 916.3 C1053.3 916.8 1066.7 917.2 1080 917.3 C1093.3 917.4 1106.7 917.2 1120 917.4 C1133.3 917.5 1146.7 918.0 1160 919.5 C1173.3 921.1 1186.7 923.7 1200 927.5 C1213.3 931.3 1226.7 936.3 1240 941.9 C1253.3 947.4 1266.7 953.5 1280 958.8 C1293.3 964.1 1306.7 968.7 1320 971.7 C1333.3 974.6 1346.7 975.8 1360 975.4 C1373.3 975.0 1386.7 972.9 1400 969.9 C1413.3 966.9 1426.7 963.1 1440 959.5 C1453.3 955.8 1466.7 952.4 1480 949.6 C1493.3 946.7 1506.7 944.5 1520 942.6 C1533.3 940.7 1546.7 939.1 1560 937.2 C1573.3 935.3 1586.7 932.9 1600 930.0 C1613.3 927.0 1626.7 923.5 1640 919.8 C1653.3 916.1 1666.7 912.3 1680 909.4 C1693.3 906.6 1706.7 904.7 1720 904.5 C1733.3 904.2 1746.7 905.8 1760 908.9 C1773.3 912.1 1786.7 916.8 1800 922.3 C1813.3 927.7 1826.7 933.7 1840 939.2 C1853.3 944.6 1866.7 949.5 1880 953.1 C1893.3 956.8 1906.7 959.2 1920 960.6 C1933.3 961.9 1946.7 962.3 1960 962.5 C1973.3 962.6 1986.7 962.5 2000 962.7 L2000 1160 L-80 1160 Z"/>
